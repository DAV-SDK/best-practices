[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "davbp"
version = "0.1"
dependencies = [
	"requests >= 2.20",
	"gitpython >= 3.1.20",
	"pytest >= 6.2"
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["davbp"]
