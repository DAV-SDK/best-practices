name: Update DAV SDK best-practices site

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch previous history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-old

      - name: Carry history forward
        run: |
          mkdir -p site
          if [ -f gh-pages-old/history.jsonl ]; then
            cp gh-pages-old/history.jsonl site/history.jsonl
          fi
          rm -rf gh-pages-old

      - name: Generate site data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m venv .env
          source .env/bin/activate
          pip install -e .
          python3 scripts/generate-site-data.py --verbose --site-directory="./site"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
