name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .env
          source .env/bin/activate
          pip install -e .

      - name: Formatting
        run: black scripts/ davbp/ tests/

      - name: Run tests
        run: pytest tests/
